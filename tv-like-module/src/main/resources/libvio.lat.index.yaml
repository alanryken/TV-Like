version: 1
paths:
  - matches:
      - /
      - /index.html
    sections:
      - name: nav
        selector: .stui-header__menu
        items:
          selector: li
          fields:
            text:
              selector: a
              transforms:
                - trim
            link:
              selector: a
              attr: href
              transforms:
                - abs-url
      - name: vodlist
        selector: .stui-pannel__bd
        items:
          selector: .stui-vodlist > li
          fields:
            text:
              selector: .title a
              transforms:
                - trim
            link:
              selector: .stui-vodlist__thumb
              attr: href
              transforms:
                - abs-url
            img:
              selector: .stui-vodlist__thumb
              attr: data-original
              transforms:
                - abs-url