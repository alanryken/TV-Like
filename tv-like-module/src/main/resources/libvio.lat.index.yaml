version: 1
paths:
  - matches:
      - /
      - /index.html
    sections:
      - name: nav
        selector: .stui-header__menu
        items:
          selector: li
          fields:
            text:
              selector: a
              transforms:
                - trim
            link:
              selector: a
              attr: href
              transforms:
                - abs-url
      - name: video-list
        selector: .stui-vodlist
        items:
          selector: li
          limit: 12
          fields:
            text:
              selector: .title a
              transforms:
                - trim
            link:
              selector: .title a
              attr: href
              transforms:
                - abs-url
            img:
              selector: .lazyload
              attr: data-original
              transforms:
                - abs-url
      - name: category-head
        selector: .stui-vodlist__head
        fields:
          text:
            selector: h3 a
            transforms:
              - trim
          link:
            selector: h3 a
            attr: href
            transforms:
              - abs-url